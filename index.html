<!-- 旧域名升级提示：只在旧地址显示，新版地址不显示（见下方脚本） -->
<div id="upgradeBar" hidden></div>
<script>
(function () {
  var OLD_HOST = /^memory-station\.app\.workbuddy\.host$/;
  var NEW_URL = 'https://a4e1f625ef29cfad5.app.workbuddy.host/?sharecode=XZV6RVRO7O';
  if (!OLD_HOST.test(location.hostname)) return;

  var bar = document.getElementById('upgradeBar');
  if (!bar) return;
  bar.hidden = false;
  bar.style.cssText = 'position:relative;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;' +
    'padding:10px 14px;background:linear-gradient(90deg,#fff4e5,#ffe9d6);border-bottom:1px solid #ffd7ae;' +
    'font-size:13px;line-height:1.6;color:#8a4b12;';
  bar.innerHTML =
    '<span style="flex:1;min-width:220px">' +
    '<b>本应用已升级到新版</b>，请把下面的新链接加入收藏（旧链接仍可用，但将在一段时间后彻底下线）。' +
    '<br><a href="' + NEW_URL + '" style="color:#c2410c;font-weight:700;word-break:break-all">' + NEW_URL + '</a>' +
    '</span>' +
    '<a href="' + NEW_URL + '" style="flex:none;background:#c2410c;color:#fff;text-decoration:none;' +
    'padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px">前往新版 →</a>';
})();
</script>
