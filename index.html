<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f7ff" />
<title>记忆小站 · 遗忘曲线单词卡</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="stylesheet" href="css/app.css?v=1.8.0" />
</head>
<body>

<div class="bg-deco" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>

<div id="app" class="app">
  <header class="topbar" id="topbar">
    <a class="brand" href="#/home">
      <span class="brand-mark">🌱</span>
      <span class="brand-text">记忆小站</span>
    </a>
    <div class="topbar-right">
      <button class="profile-chip" id="profileChip" type="button" aria-label="当前小朋友">
        <span class="avatar" id="profileAvatar">🐣</span>
        <span class="profile-name" id="profileName">未选择</span>
      </button>
    </div>
  </header>

  <div class="store-banner" id="storeBanner" hidden>
    <span class="sb-ico">⚠️</span>
    <span class="sb-text" id="storeBannerText">当前环境无法保存数据</span>
    <button class="sb-btn" id="storeBannerBtn" type="button">怎么办？</button>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <a class="tab" href="#/home" data-tab="home"><span class="tab-ico">🏠</span><span>首页</span></a>
    <a class="tab" href="#/study" data-tab="study"><span class="tab-ico">🎯</span><span>学习</span></a>
    <a class="tab" href="#/progress" data-tab="progress"><span class="tab-ico">📈</span><span>进度</span></a>
    <a class="tab" href="#/me" data-tab="me"><span class="tab-ico">🧒</span><span>我的</span></a>
  </nav>
</div>

<!-- 全局浮层 -->
<div class="sheet-mask" id="sheetMask" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/meta.js?v=1.8.0"></script>
<script src="js/strings.js?v=1.8.0"></script>
<script src="js/data-en.js?v=1.8.0"></script>
<script src="js/data-zh.js?v=1.8.0"></script>
<script src="js/data-py.js?v=1.8.0"></script>
<script src="js/py-dict.js?v=1.8.0"></script>
<script src="js/audio-manifest.js?v=1.8.0"></script>
<script src="js/srs.js?v=1.8.0"></script>
<script src="js/store.js?v=1.8.0"></script>
<script src="js/speech.js?v=1.8.0"></script>
<script src="js/cloud.js?v=1.8.0"></script>
<script src="js/app.js?v=1.8.0"></script>
</body>
</html>
