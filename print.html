<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>复习单 · 打印</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<style>
  :root {
    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #9ca3af;
    --line: #e5e7eb;
    --line-strong: #d1d5db;
    --accent: #1b2340;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    color: var(--ink);
    background: #eef1f7;
    -webkit-text-size-adjust: 100%;
  }

  /* ============ 控制区（不打印） ============ */
  .ctrl {
    max-width: 900px; margin: 0 auto; padding: 18px 16px 6px;
  }
  .ctrl-card {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; box-shadow: 0 4px 18px rgba(20,30,70,.06);
  }
  .ctrl h1 {
    font-size: 17px; margin: 0 0 4px; font-weight: 800;
  }
  .ctrl .hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.6; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .fld { display: flex; flex-direction: column; gap: 5px; min-width: 130px; flex: 1; }
  .fld label { font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .fld input, .fld select {
    padding: 9px 11px; border: 1.5px solid var(--line-strong); border-radius: 10px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: #fff;
  }
  .fld input:focus, .fld select:focus { outline: none; border-color: #4f6bff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--line-strong);
    background: #fff; font-size: 13px; font-weight: 600; color: var(--ink-2);
    cursor: pointer; user-select: none;
  }
  .chip.on { background: #1b2340; border-color: #1b2340; color: #fff; }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    padding: 10px 18px; border-radius: 11px; border: none; background: #1b2340;
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn.ghost { background: #fff; color: var(--ink-2); border: 1.5px solid var(--line-strong); }
  .count { font-size: 12.5px; color: var(--ink-3); margin-left: auto; align-self: center; }

  /* ============ 纸张 ============ */
  .paper {
    max-width: 900px; margin: 14px auto 40px; background: #fff;
    padding: 22px 24px 28px; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(20,30,70,.08);
  }
  .sheet-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink);
    margin-bottom: 14px;
  }
  .sheet-title { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
  .sheet-meta { font-size: 12px; color: var(--ink-2); text-align: right; line-height: 1.6; }
  .sheet-fill { font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px; }
  .sheet-fill span { display: inline-block; border-bottom: 1px solid var(--ink-3); min-width: 90px; }

  .grid { display: grid; gap: 10px; }
  .grid.c2 { grid-template-columns: repeat(2, 1fr); }
  .grid.c3 { grid-template-columns: repeat(3, 1fr); }
  .grid.c1 { grid-template-columns: 1fr; }

  .item {
    border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 9px 11px; break-inside: avoid; page-break-inside: avoid;
  }
  .item-top { display: flex; align-items: baseline; gap: 8px; }
  .big { font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: 1px; }
  .big.en { font-size: 21px; letter-spacing: 0; }
  .big.py { font-size: 21px; letter-spacing: .5px; }
  .tag {
    font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 5px; white-space: nowrap;
  }
  .py { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; letter-spacing: .5px; }
  .mean { font-size: 12.5px; color: var(--ink); margin-top: 4px; line-height: 1.5; }
  .words { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
  .blank { display: inline-block; min-width: 72px; border-bottom: 1px solid var(--ink-3); }
  .blank.wide { min-width: 130px; }

  .empty { padding: 40px 10px; text-align: center; color: var(--ink-3); font-size: 13.5px; line-height: 1.8; }

  /* ============ 打印 ============ */
  @page { size: A4; margin: 12mm 10mm; }
  @media print {
    body { background: #fff; }
    .ctrl { display: none !important; }
    .paper {
      margin: 0; padding: 0; box-shadow: none; border-radius: 0;
      max-width: none; width: auto;
    }
    .item { border-color: #b8bcc4; }
    .grid { gap: 8px; }
    .big { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="ctrl">
  <div class="ctrl-card">
    <h1>生成复习单</h1>
    <div class="hint">把「答错过」「还不熟」或者「反复没记住」的字词挑出来，排成一页，打印出来给孩子练。</div>

    <div class="row">
      <div class="fld">
        <label>小朋友</label>
        <select id="fProfile"></select>
      </div>
      <div class="fld">
        <label>起始日期</label>
        <input id="fFrom" type="date" />
      </div>
      <div class="fld">
        <label>结束日期</label>
        <input id="fTo" type="date" />
      </div>
    </div>

    <div class="fld" style="margin-bottom:12px">
      <label>包含内容</label>
      <div class="chips" id="fMods"></div>
    </div>

    <div class="row">
      <div class="fld">
        <label>筛选条件</label>
        <select id="fRule">
          <option value="weak">答错过，或还没记牢（推荐）</option>
          <option value="focus">要重点练：错 2 次以上或模糊 2 次以上（不看日期）</option>
          <option value="wrong">只看答错过的</option>
          <option value="low">只看阶段≤2（很不熟）</option>
          <option value="all">这段时间练过的全部</option>
        </select>
      </div>
      <div class="fld">
        <label>每行几个</label>
        <select id="fCols">
          <option value="2">2 个（字大，适合练写）</option>
          <option value="3" selected>3 个（省纸）</option>
          <option value="1">1 个（最大）</option>
        </select>
      </div>
      <div class="fld">
        <label>答案</label>
        <select id="fShow">
          <option value="1" selected>显示拼音和释义</option>
          <option value="0">只印字词，答案留白（自测用）</option>
        </select>
      </div>
    </div>

    <div class="acts">
      <button class="btn" id="btnBuild">生成复习单</button>
      <button class="btn ghost" id="btnPrint">打印 / 存 PDF</button>
      <span class="count" id="fCount"></span>
    </div>
  </div>
</div>

<div class="paper" id="paper">
  <div class="empty">选择条件后点「生成复习单」</div>
</div>

<script src="js/meta.js?v=1.7.3"></script>
<script src="js/data-en.js?v=1.7.3"></script>
<script src="js/data-zh.js?v=1.7.3"></script>
<script src="js/data-py.js?v=1.7.3"></script>
<script src="js/srs.js?v=1.7.3"></script>
<script src="js/store.js?v=1.7.3"></script>
<script src="js/print.js?v=1.7.3"></script>
</body>
</html>
