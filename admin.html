<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#1b2340" />
<title>记忆小站 · 管理后台</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/app.css?v=1.7.6" />
<style>
  body { background: #f2f5fb; }
  .adm-wrap { max-width: 1080px; margin: 0 auto; padding: 18px 16px 60px; }
  .adm-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; }
  .adm-logo { width: 42px; height: 42px; border-radius: 13px; background: #1b2340; color: #fff;
              display: grid; place-items: center; font-size: 20px; flex: none; }
  .adm-title { font-size: 18px; font-weight: 800; color: #1b2340; line-height: 1.3; }
  .adm-sub { font-size: 12px; color: #8b93aa; margin-top: 2px; }
  .adm-card { background: #fff; border: 1px solid #e7ecf7; border-radius: 16px;
              box-shadow: 0 6px 20px rgba(20,30,70,.05); padding: 16px 18px; margin-bottom: 16px; }
  .adm-card h2 { font-size: 14.5px; font-weight: 800; color: #1b2340; margin: 0 0 12px;
                 display: flex; align-items: center; justify-content: space-between; }
  .adm-card h2 i { font-style: normal; font-size: 11.5px; font-weight: 600; color: #8b93aa; }
  .adm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
  .adm-stat { background: #f7f9ff; border: 1px solid #eaeffa; border-radius: 13px; padding: 12px 14px; }
  .adm-stat b { display: block; font-size: 22px; color: #1b2340; line-height: 1.2; }
  .adm-stat span { font-size: 11.5px; color: #8b93aa; }
  .adm-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .adm-table th { text-align: left; font-weight: 700; color: #8b93aa; font-size: 11.5px;
                  padding: 7px 8px; border-bottom: 1px solid #eef2fa; white-space: nowrap; }
  .adm-table td { padding: 9px 8px; border-bottom: 1px solid #f4f7fd; color: #1b2340; vertical-align: top; }
  .adm-table tr:last-child td { border-bottom: none; }
  .adm-num { font-variant-numeric: tabular-nums; text-align: right; }
  .adm-empty { font-size: 12.5px; color: #8b93aa; padding: 14px 2px; }
  .adm-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .adm-tab { padding: 8px 14px; border-radius: 11px; background: #fff; border: 1px solid #e7ecf7;
             font-size: 13px; font-weight: 700; color: #5a6480; cursor: pointer; }
  .adm-tab.on { background: #1b2340; border-color: #1b2340; color: #fff; }
  .adm-field { margin-bottom: 10px; }
  .adm-field label { display: block; font-size: 12.5px; font-weight: 700; color: #5a6480; margin-bottom: 5px; }
  .adm-input { width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f5; border-radius: 11px;
               font-size: 14px; font-family: inherit; color: #1b2340; background: #fff; }
  .adm-input:focus { outline: none; border-color: #4f6bff; }
  .adm-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .adm-row > * { flex: 1; min-width: 150px; }
  .adm-btn { padding: 10px 18px; border-radius: 11px; border: none; background: #4f6bff; color: #fff;
             font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .adm-btn:disabled { opacity: .55; cursor: default; }
  .adm-btn.ghost { background: #fff; color: #5a6480; border: 1.5px solid #e2e8f5; }
  .adm-msg { font-size: 12.5px; line-height: 1.6; margin-top: 8px; min-height: 18px; }
  .adm-msg.err { color: #d92b52; }
  .adm-msg.ok { color: #12906f; }
  .adm-note { font-size: 12px; color: #8b93aa; line-height: 1.7; margin-top: 6px; }
  .adm-login { max-width: 420px; margin: 8vh auto 0; }
  .adm-who { font-size: 12px; color: #5a6480; }
  .adm-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
               background: #eefdf7; color: #12906f; font-weight: 700; }
  .adm-badge.warn { background: #fff7e6; color: #8a5300; }
  .adm-scroll { max-height: 380px; overflow: auto; }
  @media (max-width: 620px) {
    .adm-wrap { padding: 14px 12px 50px; }
    .adm-table { font-size: 12px; }
    .adm-table th, .adm-table td { padding: 7px 5px; }
  }
</style>
</head>
<body>
<div class="adm-wrap">
  <div class="adm-head">
    <div class="adm-logo">🛠</div>
    <div>
      <div class="adm-title">记忆小站 · 管理后台</div>
      <div class="adm-sub" id="admSub">仅管理员可访问</div>
    </div>
  </div>
  <div id="admBody"></div>
</div>

<script src="js/meta.js?v=1.7.6"></script>
<script src="js/cloud.js?v=1.7.6"></script>
<script src="js/admin.js?v=1.7.6"></script>
</body>
</html>
